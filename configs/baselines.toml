# Baseline settings chosen on the VALIDATION split only.
# Rule (set before running): lowest mean RMSSE over series within each family.
# Used by the final test run (week 2, item 7). Do not re-tune on test.

[moving_average]
window_days = 28

[seasonal_average]
weeks = 16

